services:
  panel:
    image: ghcr.io/pelican/panel:latest@sha256:68618885bb9cf49154c627863ba0bfc7308888ec87536aee7c8cbc2e4b0d929d
    container_name: pelican
    restart: always
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      TZ: Europe/Paris  # Change this variable
      APP_TIMEZONE: Europe/Paris  # Change this variable
      APP_ENV: production
      APP_URL: "https://panel.domain.com"  # Change this variable
      ADMIN_EMAIL: admin@domain.com  # Change this variable
    networks:
      - pelican-net

  wings:
    image: ghcr.io/pelican/wings:latest@sha256:45a970378805c1fb9ba25c8f933c25f2339e5a7a87d9925721b89459abe66c7b
    container_name: pelican_wings
    restart: always
    ports:
      - 8080:8080
      - 2022:2022
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Paris  # Change this variable
      APP_TIMEZONE: Europe/Paris  # Change this variable
      WINGS_UID: 1000
      WINGS_GID: 1000
      WINGS_USERNAME: pelican
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "/etc/pelican/:/etc/pelican/"
      - "/var/lib/pelican/:/var/lib/pelican/"
      - "/var/log/pelican/:/var/log/pelican/"
      - "/tmp/pelican/:/tmp/pelican/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
    networks:
      - wings0

  database:
    image: mariadb:latest@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "pelican-db:/var/lib/mysql"
    environment:
      MYSQL_PASSWORD: "changeme"  # Change this variable
      MYSQL_ROOT_PASSWORD: "changeme" # Change this variable
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pelican"
    networks:
      - pelican-net

  # pelican-exporter:          # if you want a prometheus endpoint uncomment these. Related doc -> https://github.com/LOENS2/pterodactyl_exporter
  #   image: loens2/pterodactyl_exporter:latest
  #   container_name: pelican-exporter
  #   ports:
  #     - "9531:9531"
  #   volumes:
  #     - ./config.yml:/opt/pterodactyl_exporter/config/config.yml

volumes:
  pelican-data:
  pelican-logs:
  pelican-db:

networks:
  pelican-net:
    name: pelican-net
  wings0:
    name: wings0
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: wings0