services:
  panel:
    image: ghcr.io/pelican/panel:latest@sha256:9a4364ce709cad6240deadde3396858cab8c00a3be456e5c4e424a10c71820a0
    container_name: pelican
    restart: always
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
    environment:
      TZ: Europe/Paris  # Change this variable
      APP_TIMEZONE: Europe/Paris  # Change this variable
      APP_ENV: production
      APP_URL: "https://panel.domain.com"  # Change this variable
      ADMIN_EMAIL: admin@domain.com  # Change this variable
    networks:
      - pelican-net

  wings:
    image: ghcr.io/pelican/wings:latest@sha256:cf62cae99329dde1a0507d144fc5fb0c5e9d6c8346e6987d67dc08bc323e5644
    container_name: pelican_wings
    restart: always
    ports:
      - 8080:8080
      - 2022:2022
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Paris  # Change this variable
      APP_TIMEZONE: Europe/Paris  # Change this variable
      WINGS_UID: 1000
      WINGS_GID: 1000
      WINGS_USERNAME: pelican
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "/etc/pelican/:/etc/pelican/"
      - "/var/lib/pelican/:/var/lib/pelican/"
      - "/var/log/pelican/:/var/log/pelican/"
      - "/tmp/pelican/:/tmp/pelican/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
    networks:
      - wings0

  database:
    image: mariadb:latest@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "pelican-db:/var/lib/mysql"
    environment:
      MYSQL_PASSWORD: "changeme"  # Change this variable
      MYSQL_ROOT_PASSWORD: "changeme" # Change this variable
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pelican"
    networks:
      - pelican-net

  # pelican-exporter:          # if you want a prometheus endpoint uncomment these. Related doc -> https://github.com/LOENS2/pterodactyl_exporter
  #   image: loens2/pterodactyl_exporter:latest
  #   container_name: pelican-exporter
  #   ports:
  #     - "9531:9531"
  #   volumes:
  #     - ./config.yml:/opt/pterodactyl_exporter/config/config.yml

volumes:
  pelican-data:
  pelican-logs:
  pelican-db:

networks:
  pelican-net:
    name: pelican-net
  wings0:
    name: wings0
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: wings0